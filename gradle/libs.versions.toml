[versions]
couchbase-lite-android = "4.1.0"
couchbase-lite-java = "4.1.0"
couchbase-lite-objc = "3.3.0"
couchbase-lite-c = "3.2.4"
couchbase-lite-vector-search = "2.0.0"
dokka = "2.2.0"
mockk = "1.14.11"

[plugins]
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version = "9.2.1" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version = "2.4.0" }
kotlinx-atomicfu = { id = "org.jetbrains.kotlinx.atomicfu", version = "0.33.0" }
kotlinx-binary-compatibility-validator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version = "0.18.1" }
vanniktech-maven-publish = { id = "com.vanniktech.maven.publish", version = "0.37.0" }

[libraries]
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version = "2.11.0" }
androidx-startup = { module = "androidx.startup:startup-runtime", version = "1.2.0" }
androidx-test-core-ktx = { module = "androidx.test:core-ktx", version = "1.7.0" }
androidx-test-runner = { module = "androidx.test:runner", version = "1.7.0" }
couchbase-lite-android = { module = "com.couchbase.lite:couchbase-lite-android", version.ref = "couchbase-lite-android" }
couchbase-lite-android-ee = { module = "com.couchbase.lite:couchbase-lite-android-ee", version.ref = "couchbase-lite-android" }
couchbase-lite-java = { module = "com.couchbase.lite:couchbase-lite-java", version.ref = "couchbase-lite-java" }
couchbase-lite-java-ee = { module = "com.couchbase.lite:couchbase-lite-java-ee", version.ref = "couchbase-lite-java" }
couchbase-lite-android-vector-search-arm64 = { module = "com.couchbase.lite:couchbase-lite-android-vector-search-arm64", version.ref = "couchbase-lite-vector-search" }
couchbase-lite-android-vector-search-x64 = { module = "com.couchbase.lite:couchbase-lite-android-vector-search-x86_64", version.ref = "couchbase-lite-vector-search" }
couchbase-lite-java-vector-search = { module = "com.couchbase.lite:couchbase-lite-java-vector-search", version.ref = "couchbase-lite-vector-search" }
dokka-versioning = { module = "org.jetbrains.dokka:versioning-plugin", version.ref = "dokka" }
kermit = { module = "co.touchlab:kermit", version = "2.1.0" }
korlibs-korio = { module = "com.soywiz.korlibs.korio:korio", version = "4.0.10" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version = "1.11.0" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version = "0.8.0" }
kotlinx-io = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version = "0.9.1" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = "1.11.0" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
mockk-android = { module = "io.mockk:mockk-android", version.ref = "mockk" }
# 3.4.0-beta01 is the last version published for iosX64/macosX64,
# required as long as Kotbase supports Apple x86_64 targets
paging = { module = "androidx.paging:paging-common", version = "3.4.0-beta01" }
stately = { module = "co.touchlab:stately-concurrent-collections", version = "2.1.0" }
